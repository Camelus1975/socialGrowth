<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Social Growth AI — Action Feed & Copilot</title>
  <link rel="stylesheet" href="/styles_v3.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Premium Auth Layer (Reused from previous V2 but simplified) -->
  <div id="auth-login-screen" class="auth-overlay" style="display:flex;">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">▲</div>
        <h1>Social Growth AI</h1>
        <p>Log in to access your Copilot</p>
      </div>
      <div class="auth-methods">
        <button class="btn btn-github" onclick="window.simulateSbAuthVerify('github')">Continue with GitHub</button>
        <button class="btn btn-google" onclick="window.simulateSbAuthVerify('google')">Continue with Google</button>
      </div>
    </div>
  </div>

  <!-- V3 App Layout -->
  <div id="app-layout" style="display:none;" class="app-layout">
    
    <!-- Left Navigation Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo">▲</div>
      </div>
      
      <ul class="nav-links">
        <li class="nav-item active" data-action="switchWorkspace" data-args="home">
          <span class="icon">🏠</span> Home
        </li>
        <li class="nav-item" data-action="switchWorkspace" data-args="copilot">
          <span class="icon">✨</span> Copilot
        </li>
        <li class="nav-item" data-action="switchWorkspace" data-args="calendar">
          <span class="icon">📅</span> Calendar
        </li>
        <li class="nav-item" data-action="switchWorkspace" data-args="inbox">
          <span class="icon">📥</span> Inbox
        </li>
        <li class="nav-item" data-action="switchWorkspace" data-args="growth">
          <span class="icon">📈</span> Growth
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="nav-item" data-action="openModal" data-args="settings-modal">
          <span class="icon">⚙️</span> Settings
        </div>
        <div class="user-profile" data-action="openModal" data-args="user-profile-modal">
          <img src="" id="user-header-avatar" alt="Avatar" class="avatar-img">
          <div class="user-info">
            <span id="user-header-name" class="user-name">User</span>
            <span class="user-role">Founder</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Workspace Area -->
    <main class="workspace-container">
      
      <!-- View 1: Home (Action Feed) -->
      <section id="view-home" class="view-panel active">
        <header class="view-header">
          <h2>Good morning. Here is what you need to do today:</h2>
        </header>
        <div class="feed-container" id="action-feed-container">
          <!-- Feed items dynamically injected -->
        </div>
      </section>

      <!-- View 2: Copilot -->
      <section id="view-copilot" class="view-panel" style="display:none;">
        <div class="copilot-container">
          <div class="chat-history" id="copilot-chat-history">
            <!-- Chat history injected here -->
          </div>
          <div class="chat-input-wrapper">
            <input type="text" id="copilot-input" class="chat-input" placeholder="Type a command, drag an asset, or paste a link...">
            <button class="btn btn-primary" id="copilot-send-btn">↑</button>
          </div>
        </div>
      </section>

      <!-- View 3: Calendar -->
      <section id="view-calendar" class="view-panel" style="display:none;">
        <header class="view-header calendar-header">
          <button class="btn btn-secondary">&lt;</button>
          <h2>This Week</h2>
          <button class="btn btn-secondary">&gt;</button>
          <div style="flex:1"></div>
          <button class="btn btn-primary">+ New Post</button>
        </header>
        <div class="calendar-grid" id="calendar-grid-container">
          <!-- Calendar injected here -->
        </div>
      </section>

      <!-- View 4: Inbox -->
      <section id="view-inbox" class="view-panel" style="display:none;">
        <div class="inbox-layout">
          <div class="inbox-sidebar" id="inbox-thread-list">
            <!-- Threads injected here -->
          </div>
          <div class="inbox-main" id="inbox-active-thread">
            <!-- Active thread injected here -->
          </div>
        </div>
      </section>

      <!-- View 5: Growth -->
      <section id="view-growth" class="view-panel" style="display:none;">
        <header class="view-header">
          <h2>Growth Analytics</h2>
        </header>
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Audience</div>
            <div class="kpi-value" id="kpi-audience">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Engagement</div>
            <div class="kpi-value" id="kpi-engagement">0%</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Revenue</div>
            <div class="kpi-value" id="kpi-revenue"></div>
          </div>
        </div>
        <div class="analysis-box">
          <h3>AI Growth Analysis</h3>
          <p id="growth-analysis-text">Loading insights...</p>
        </div>
      </section>

    </main>

    <!-- Global AI Floating Action Button -->
    <button class="fab-ai" data-action="switchWorkspace" data-args="copilot">⚡</button>
  </div>

  <script type="module" src="/app_v3.js"></script>
</body>
</html>
